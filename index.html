<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صوتي | Sawti</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5f5;color:#173b40;font:20px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#fff;border-bottom:1px solid #d5e4e4}h1{margin:0;font-size:30px}small{font-size:14px;color:#52696c}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #b9cecf;border-radius:14px;background:white;color:inherit;padding:12px;touch-action:manipulation}button:focus-visible{outline:4px solid #e1a53c}button.primary{background:#176c68;color:white;border:0}main{max-width:1250px;margin:auto;padding:18px}.toolbar,.sentence,.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}.sentence{background:white;border:1px solid #d5e4e4;border-radius:18px;padding:14px;min-height:86px}.sentenceText{flex:1;min-width:150px;font-size:27px}.tabs button.active{background:#176c68;color:white}.grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:12px}.tile{min-height:155px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border-bottom:5px solid #a9d0cc;padding:12px;overflow:hidden}.tile:active{background:#d9efea}.tile img{width:100%;height:105px;object-fit:contain;border-radius:8px}.emoji{font-size:57px;line-height:1.25}.tile strong{font-size:25px}.tile small{font-size:15px}.urgent{border-bottom-color:#d68e75}.panel{background:white;border:1px solid #d5e4e4;border-radius:16px;padding:18px;margin:12px 0}.editor{direction:ltr;text-align:left}.editor label{display:block;margin:10px 0 4px;font-size:15px;font-weight:600}.editor input:not([type=checkbox]),.editor select{width:100%;padding:9px;border:1px solid #bccdcd;border-radius:8px}.editor .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.editor button{font-size:16px}.editor img{max-width:120px;max-height:90px;object-fit:contain}.muted{color:#52696c;font-size:15px}.hidden{display:none!important}.danger{color:#a22626}.sr{position:absolute;left:-9999px}@media(max-width:650px){main{padding:10px}.grid{grid-template-columns:repeat(min(var(--cols,4),2),minmax(0,1fr))}.tile{min-height:130px}.tile strong{font-size:21px}.editor .fields{grid-template-columns:1fr}header{padding:12px}.emoji{font-size:45px}}@media(prefers-reduced-motion:no-preference){button:active{transform:scale(.98)}}
</style></head><body><header><div><h1>صوتي <small>Sawti · My Voice</small></h1></div><button id="settings" aria-label="Caregiver settings">⚙️</button></header><main><section id="board"><div class="sentence"><div class="sentenceText" id="phrase" aria-live="polite">شنو تريد تقول؟</div><button id="speak" class="primary">🔊 احچي</button><button id="undo" aria-label="Undo">↶</button><button id="clear" aria-label="Clear">✕</button></div><div class="toolbar"><button id="mode">جملة / Sentence</button><button id="full">⛶</button><small id="status" role="status"></small></div><div id="quick" class="grid" style="margin-bottom:16px"></div><nav id="tabs" class="tabs" aria-label="Categories"></nav><div id="cards" class="grid"></div></section><section id="editor" class="editor hidden"><div class="panel"><h2>Caregiver settings</h2><button id="back" class="primary">Return to communication board</button><p class="muted">Pictures and recordings are stored on this device. Export a backup before clearing browser data. No account or server is required.</p><div class="fields"><div><label>Columns on tablet</label><select id="columns"><option>2</option><option>3</option><option>4</option><option>5</option></select></div><div><label>Arabic voice</label><select id="voice"></select></div></div><label><input type="checkbox" id="english"> Show English labels</label><label><input type="checkbox" id="autospeak"> Speak each card immediately</label><div class="actions"><button id="export">Export backup (JSON)</button><button id="import">Import backup</button><input type="file" id="importFile" accept="application/json,.json" class="hidden"><button id="addCat">Add category</button><button id="add" class="primary">Add card</button></div><div id="categoryEditor"></div></div><div id="editCards"></div></section></main>
<script>
const seedCategories=[['needs','احتياجات','Needs'],['food','الأكل والشرب','Food & drink'],['feelings','المشاعر','Feelings'],['pain','الألم والجسم','Pain & body'],['activities','النشاطات','Activities'],['family','العائلة','Family'],['words','كلمات','Words']].map(([id,ar,en])=>({id,ar,en}));
const rows=[['needs','💧','أريد مي','Water',1],['needs','🍽️','أريد آكل','Food',1],['needs','🚽','أريد الحمام','Bathroom',1],['needs','🙋','ساعدني','Help',1],['needs','✋','لا','No',1],['needs','✅','إي','Yes',1],['needs','🛑','وقف','Stop',1],['needs','🤕','عندي وجع','Pain',1],['needs','🛏️','أريد أنام','Sleep'],['needs','🚿','أريد أتحمم','Shower'],['needs','👕','أريد أبدل ملابسي','Change clothes'],['food','🥤','أريد عصير','Juice'],['food','🍚','أريد تمن','Rice'],['food','🍗','أريد دجاج','Chicken'],['food','🍞','أريد خبز','Bread'],['food','🍎','أريد تفاح','Apple'],['food','🍌','أريد موز','Banana'],['food','🍪','أريد بسكوت','Cookies'],['food','🥛','أريد حليب','Milk'],['feelings','😊','أنا فرحان','Happy'],['feelings','😢','أنا زعلان','Sad'],['feelings','😠','أنا معصب','Angry'],['feelings','😨','أنا خايف','Scared'],['feelings','😴','أنا تعبان','Tired'],['feelings','😐','أنا ضايج','Bored'],['feelings','❤️','أحبك','I love you'],['feelings','🤫','أريد هدوء','Quiet'],['feelings','🫂','أريد حضن','Hug'],['pain','👤','راسي يوجعني','Head'],['pain','🦷','سني يوجعني','Tooth'],['pain','👂','أذني توجعني','Ear'],['pain','🫃','بطني يوجعني','Stomach'],['pain','🫁','صدري يوجعني','Chest'],['pain','✋','إيدي توجعني','Hand'],['pain','🦵','رجلي توجعني','Leg'],['pain','🦶','قدمي توجعني','Foot'],['pain','🥵','أنا حران','Hot'],['pain','🥶','أنا بردان','Cold'],['pain','🤢','أحس بالغثيان','Nausea'],['pain','😣','الوجع قوي','Severe pain'],['pain','🙂','الوجع خفيف','Mild pain'],['activities','🚗','أريد أطلع بالسيارة','Car ride'],['activities','📺','أريد أشوف التلفزيون','TV'],['activities','🎵','أريد أسمع أغاني','Music'],['activities','🚶','أريد أتمشى','Walk'],['activities','📱','أريد التلفون','Phone'],['activities','🌳','أريد أطلع بره','Outside'],['activities','🏠','أريد أروح للبيت','Home'],['family','👩','أريد أمي','Mom'],['family','👨','أريد أبوي','Dad'],['family','👨‍🦱','أريد أخوي','Brother'],['family','👩‍🦱','أريد أختي','Sister'],['words','🙋','أريد','I want'],['words','➕','بعد','More'],['words','✔️','خلص','Finished'],['words','👎','ما أريد','I don’t want'],['words','👋','تعال','Come'],['words','⏳','انتظر','Wait'],['words','🔄','شي ثاني','Something else'],['words','🤷','ما أعرف','I don’t know'],['words','🙏','شكراً','Thank you'],['words','🚪','أريد أبقى وحدي','Leave me alone']];
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);const defaults=()=>({version:1,categories:seedCategories,cards:rows.map(([cat,emoji,ar,en,quick],i)=>({id:'c'+i,cat,emoji,ar,en,quick:!!quick,img:'',audio:''})),prefs:{cols:4,english:true,autospeak:true,voice:''}});let state=defaults(),db,category='needs',sentence=[],compose=false;const $=id=>document.getElementById(id);const el=(tag,txt,cls)=>{let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n};function btn(txt,fn,cls){let n=el('button',txt,cls);n.onclick=fn;return n}function safeMedia(s,kind){return typeof s==='string'&&new RegExp('^data:'+kind+'/[a-z0-9.+-]+;base64,','i').test(s)}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('sawti-aac',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}function get(){return new Promise((res,rej)=>{let r=db.transaction('data').objectStore('data').get('board');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function save(){if(!db){$('status').textContent='Storage unavailable — export a backup';return}let t=db.transaction('data','readwrite');t.objectStore('data').put(state,'board');t.onabort=()=>{$('status').textContent='Could not save — export a backup';alert('Storage failed. Export a backup.')}}
let audio;function say(c){if(audio){audio.pause();audio=null}window.speechSynthesis?.cancel();if(c.audio&&safeMedia(c.audio,'audio')){audio=new Audio(c.audio);audio.play().catch(()=>fallback(c.ar));return}fallback(c.ar)}function fallback(text){if(!window.speechSynthesis){$('status').textContent='Arabic speech unavailable; upload recordings.';return}let u=new SpeechSynthesisUtterance(text);u.lang='ar-IQ';let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.voiceURI===state.prefs.voice)||voices.find(x=>x.lang.toLowerCase()==='ar-iq')||voices.find(x=>x.lang.toLowerCase().startsWith('ar'));if(v)u.voice=v;else $('status').textContent='No Arabic voice found. Add recordings for reliable Arabic audio.';u.rate=.85;u.onerror=()=>{$('status').textContent='Speech unavailable. Try a recording.'};speechSynthesis.speak(u)}
function updatePhrase(){$('phrase').textContent=sentence.map(c=>c.ar).join('، ')||'شنو تريد تقول؟'}function choose(c){if(compose)sentence.push(c);else sentence=[c];updatePhrase();if(state.prefs.autospeak||!compose)say(c)}function tile(c){let b=btn('',()=>choose(c),'tile'+(c.quick?' urgent':''));b.setAttribute('aria-label',c.ar+' '+c.en);if(safeMedia(c.img,'image')){let im=el('img');im.src=c.img;im.alt='';b.append(im)}else b.append(el('span',c.emoji||'●','emoji'));b.append(el('strong',c.ar));if(state.prefs.english)b.append(el('small',c.en));return b}function render(){document.documentElement.style.setProperty('--cols',state.prefs.cols);$('quick').replaceChildren(...state.cards.filter(c=>c.quick).map(tile));$('tabs').replaceChildren(...state.categories.map(c=>btn(c.ar+(state.prefs.english?' · '+c.en:''),()=>{category=c.id;render()},c.id===category?'active':'')));$('cards').replaceChildren(...state.cards.filter(c=>c.cat===category&&!c.quick).map(tile));updatePhrase()}
$('speak').onclick=()=>{if(sentence.length===1)say(sentence[0]);else if(sentence.length){if(audio)audio.pause();speechSynthesis?.cancel();fallback(sentence.map(c=>c.ar).join(' '))}};$('undo').onclick=()=>{sentence.pop();updatePhrase()};$('clear').onclick=()=>{sentence=[];updatePhrase()};$('mode').onclick=()=>{compose=!compose;$('mode').textContent=compose?'✓ جملة / Sentence':'جملة / Sentence';$('mode').setAttribute('aria-pressed',compose);sentence=[];updatePhrase()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})};
function readFile(file,kind){return new Promise((res,rej)=>{if(!file||!file.type.startsWith(kind+'/')||file.size>12*1024*1024)return rej(Error('Choose a '+kind+' file under 12 MB.'));let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}function field(parent,label,value,change,type='text'){let l=el('label',label),i=el('input');i.type=type;if(type==='checkbox')i.checked=value;else i.value=value;l.append(i);parent.append(l);i.onchange=()=>change(type==='checkbox'?i.checked:i.value);return i}function mediaField(p,c,key,kind){let l=el('label',kind==='image'?'Upload picture':'Upload Arabic voice recording');let i=el('input');i.type='file';i.accept=kind+'/*';l.append(i);p.append(l);i.onchange=async()=>{try{c[key]=await readFile(i.files[0],kind);save();editRender()}catch(e){alert(e.message)}};if(c[key]){if(kind==='image'){let im=el('img');im.src=c[key];im.alt=c.en;p.append(im)}else{let a=el('audio');a.src=c[key];a.controls=true;p.append(a)}p.append(btn('Remove '+kind,()=>{c[key]='';save();editRender()}))}}
function voices(){let s=$('voice');s.replaceChildren(new Option('Automatic Arabic voice',''));(window.speechSynthesis?.getVoices()||[]).filter(v=>v.lang.toLowerCase().startsWith('ar')).forEach(v=>s.add(new Option(v.name+' ('+v.lang+')',v.voiceURI)));s.value=state.prefs.voice}function editRender(){ $('columns').value=state.prefs.cols;$('english').checked=state.prefs.english;$('autospeak').checked=state.prefs.autospeak;voices();let ce=$('categoryEditor');ce.replaceChildren();state.categories.forEach(c=>{let r=el('div',undefined,'actions');let a=el('input');a.value=c.ar;a.setAttribute('aria-label','Arabic category');let e=el('input');e.value=c.en;e.setAttribute('aria-label','English category');a.onchange=()=>{c.ar=a.value;save()};e.onchange=()=>{c.en=e.value;save()};r.append(a,e,btn('Delete category',()=>{if(state.cards.some(x=>x.cat===c.id))return alert('Move cards to another category first.');if(state.categories.length===1)return;state.categories=state.categories.filter(x=>x!==c);save();editRender()}));ce.append(r)});let root=$('editCards');root.replaceChildren();state.cards.forEach((c,index)=>{let p=el('div',undefined,'panel');p.append(el('h3',c.emoji+' '+c.en+' — '+c.ar));let f=el('div',undefined,'fields');field(f,'Arabic phrase',c.ar,v=>{c.ar=v;save()});field(f,'English label',c.en,v=>{c.en=v;save()});field(f,'Fallback emoji',c.emoji,v=>{c.emoji=v;save()});let l=el('label','Category'),s=el('select');state.categories.forEach(x=>s.add(new Option(x.en,x.id)));s.value=c.cat;s.onchange=()=>{c.cat=s.value;save()};l.append(s);f.append(l);field(f,'Always visible quick card',c.quick,v=>{c.quick=v;save()},'checkbox');p.append(f);mediaField(p,c,'img','image');mediaField(p,c,'audio','audio');let actions=el('div',undefined,'actions');actions.append(btn('Test speech',()=>say(c)),btn('Move earlier',()=>{if(index>0){[state.cards[index-1],state.cards[index]]=[state.cards[index],state.cards[index-1]];save();editRender()}}),btn('Move later',()=>{if(index<state.cards.length-1){[state.cards[index+1],state.cards[index]]=[state.cards[index],state.cards[index+1]];save();editRender()}}),btn('Delete card',()=>{if(confirm('Delete '+c.en+'?')){state.cards=state.cards.filter(x=>x!==c);save();editRender()}},'danger'));p.append(actions);root.append(p)})}
$('settings').onclick=()=>{ $('board').classList.add('hidden');$('editor').classList.remove('hidden');editRender()};$('back').onclick=()=>{$('editor').classList.add('hidden');$('board').classList.remove('hidden');if(!state.categories.some(c=>c.id===category))category=state.categories[0].id;sentence=[];render()};$('columns').onchange=e=>{state.prefs.cols=+e.target.value;save()};$('english').onchange=e=>{state.prefs.english=e.target.checked;save()};$('autospeak').onchange=e=>{state.prefs.autospeak=e.target.checked;save()};$('voice').onchange=e=>{state.prefs.voice=e.target.value;save()};if(window.speechSynthesis)speechSynthesis.onvoiceschanged=voices;
$('add').onclick=()=>{state.cards.unshift({id:uid(),cat:state.categories[0].id,ar:'كلمة جديدة',en:'New card',emoji:'⭐',quick:false,img:'',audio:''});save();editRender();$('editCards').scrollIntoView()};$('addCat').onclick=()=>{state.categories.push({id:uid(),ar:'قسم جديد',en:'New category'});save();editRender()};$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));let a=el('a');a.href=u;a.download='sawti-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.version!==1||!Array.isArray(x.categories)||!x.categories.length||!Array.isArray(x.cards)||!x.prefs)throw Error('Invalid backup');let ids=new Set();for(let c of x.categories){if(typeof c.id!=='string'||ids.has(c.id)||typeof c.ar!=='string'||typeof c.en!=='string')throw Error('Invalid category');ids.add(c.id)}let cardIds=new Set();for(let c of x.cards){if(typeof c.id!=='string'||cardIds.has(c.id)||!ids.has(c.cat)||!['ar','en','emoji'].every(k=>typeof c[k]==='string')||(c.img&&!safeMedia(c.img,'image'))||(c.audio&&!safeMedia(c.audio,'audio')))throw Error('Invalid card');cardIds.add(c.id)}if(!confirm('Replace the current board with this backup?'))return;state={...x,prefs:{cols:[2,3,4,5].includes(x.prefs.cols)?x.prefs.cols:4,english:!!x.prefs.english,autospeak:!!x.prefs.autospeak,voice:typeof x.prefs.voice==='string'?x.prefs.voice:''}};save();editRender()}catch(err){alert(err.message)}finally{e.target.value=''}};
(async()=>{try{db=await openDB();let old=await get();if(old)state=old;else save()}catch(e){$('status').textContent='Local storage unavailable; export changes manually.'}category=state.categories[0].id;render()})();
</script></body></html>
